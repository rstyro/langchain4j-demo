# LangChain4j-Agentic — Hello World 示例
spring:
  application.name: agent-hello-world

# LangChain4j OpenAI Chat Model 自动配置
langchain4j:
  open-ai:
    chat-model:
      api-key: ${AI_API_KEY:}
      base-url: https://ark.cn-beijing.volces.com/api/coding/v3
      model-name: deepseek-v3.2
      temperature: 0.7
      log-requests: true
      log-responses: true

server:
  port: 8101
