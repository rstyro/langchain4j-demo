# LangChain4j-Agentic — Conditional 条件路由
spring:
  application.name: agent-conditional

langchain4j:
  open-ai:
    chat-model:
      api-key: ${AI_API_KEY:}
      base-url: https://ark.cn-beijing.volces.com/api/coding/v3
      model-name: deepseek-v3.2
      temperature: 0.3
      log-requests: true
      log-responses: true

server:
  port: 8104
