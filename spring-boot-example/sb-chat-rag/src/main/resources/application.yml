# Spring Boot 集成 LangChain4j — RAG 检索增强生成示例
spring:
  application.name: sb-chat-rag

# LangChain4j OpenAI 自动配置（Chat Model + Embedding Model）
langchain4j:
  open-ai:
    chat-model:
      api-key: ${AI_API_KEY:}
      base-url: https://ark.cn-beijing.volces.com/api/coding/v3
      model-name: deepseek-v3.2
      temperature: 0.1
      log-requests: true
      log-responses: true
    streaming-chat-model:
      api-key: ${AI_API_KEY:}
      base-url: https://ark.cn-beijing.volces.com/api/coding/v3
      model-name: deepseek-v3.2
      temperature: 0.1
      log-requests: true
      log-responses: true
    embedding-model:
      api-key: ${AI_API_KEY:}
      base-url: https://ark.cn-beijing.volces.com/api/coding/v3
      model-name: doubao-embedding-vision
      log-requests: true
      log-responses: true

server:
  port: 8003
