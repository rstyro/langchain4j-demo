# Spring Boot 集成 LangChain4j — MCP Client 示例，通过 HTTP 调用远程 MCP Server
spring:
  application.name: sb-chat-mcp-client

server:
  port: 8005

# LangChain4j OpenAI Chat Model 自动配置
langchain4j:
  open-ai:
    chat-model:
      api-key: ${AI_API_KEY:}
      base-url: https://ark.cn-beijing.volces.com/api/coding/v3
      model-name: deepseek-v3.2
      temperature: 0.3
      log-requests: true
      log-responses: true
    streaming-chat-model:
      api-key: ${AI_API_KEY:}
      base-url: https://ark.cn-beijing.volces.com/api/coding/v3
      model-name: deepseek-v3.2
      temperature: 0.1
      log-requests: true
      log-responses: true

# MCP Server 配置
mcp:
  server:
    url: ${MCP_SERVER_URL:http://localhost:8004/mcp}


